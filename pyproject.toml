[project]
name = "agent-failure-bench"
version = "0.0.0"
description = "A framework that measures agentic AI performance on terminal-based tasks and explains the causes of their failures."
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
afb = "afb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afb"]
